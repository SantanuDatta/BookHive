name: Dependabot Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Debug Dependabot metadata
        run: |
          echo "dependency-names=${{ steps.metadata.outputs.dependency-names }}"
          echo "dependency-type=${{ steps.metadata.outputs.dependency-type }}"
          echo "update-type=${{ steps.metadata.outputs.update-type }}"
          echo "package-ecosystem=${{ steps.metadata.outputs.package-ecosystem }}"
          echo "directory=${{ steps.metadata.outputs.directory }}"

      - name: Approve safe update
        if: ${{ contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type) }}
        run: gh pr review --repo "$GH_REPO" --approve "$PR_NUMBER"
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge for safe update
        if: ${{ contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type) }}
        run: gh pr merge --repo "$GH_REPO" --auto --squash --delete-branch "$PR_NUMBER"
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
